name: Build debug APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 shells out to `sdkmanager tools`,
      # a package Google dropped from the SDK repository; that now fails
      # outright before anything Android-related runs. ubuntu-latest already
      # ships an SDK (ANDROID_HOME set, cmdline-tools present), so just
      # accept its licenses and let AGP fetch platform-36 / build-tools on
      # demand during the build, same as a local machine with SDK licenses
      # already accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: dataproxy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
