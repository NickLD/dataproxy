name: Build debug APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Assemble debug APK
        # gradle.properties pins org.gradle.java.home to the upstream
        # author's local machine path; override it here rather than edit
        # a file we don't want to carry into an eventual upstream PR.
        run: gradle -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: dataproxy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
